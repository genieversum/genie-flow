persistence:
  application_prefix: genie-flow-app
  object_store:
    host: redis
    port: 6379
    db: 1
    max_connections: 200
    object_compression: true
    expiration_seconds: 86400
  lock_store:
    host: redis
    port: 6379
    db: 2
    max_connections: 200
    expiration_seconds: 120
  progress_store:
    host: redis
    port: 6379
    db: 3
    max_connections: 200
    expiration_seconds: 120
  permanent_store:
    database_path: ./permanent/db
    blob_path: ./permanent/blob
    compress: false
    blob_directory_depth: 2
celery:
  broker: redis://localhost:6379/0
  backend: redis://localhost:6379/0
  redis_socket_timeout: 4.0
  redis_socket_connect_timeout: 4.0
  permanent_persistence_period: 30.0
api:
  debug: true
  root_path: /api/v1
genie_environment:
  template_root_path: .
  pool_size: 32
cors:
  allow_origins:
    - "*"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"