persistence:
  application_prefix: genie-flow-app
  object_store:
    host: redis
    port: 6379
    db: 1
    max_connections: 200
    object_compression: true
    expiration_seconds: 86400
  lock_store:
    host: redis
    port: 6379
    db: 2
    max_connections: 200
    expiration_seconds: 120
  progress_store:
    host: redis
    port: 6379
    db: 3
    max_connections: 200
    expiration_seconds: 120
  permanent_store:
    type: embedded
    config:
      critical_watermark: 30
      max_writes: 128
      blob_config:
        blob_url: file://./permanent/blob
        blob_directory_depth: 2
      database_config:
        database_path: ./permanent/db
        database_retries: 5
celery:
  broker: redis://localhost:6379/0
  backend: redis://localhost:6379/0
  redis_socket_timeout: 4.0
  redis_socket_connect_timeout: 4.0
  permanent_persistence_period: 30.0
  permanent_persistence_queue: permanent_store
api:
  debug: true
  root_path: /api/v1
genie_environment:
  template_root_path: .
  pool_size: 32
cors:
  allow_origins:
    - "*"
  allow_credentials: true
  allow_methods:
    - "*"
  allow_headers:
    - "*"